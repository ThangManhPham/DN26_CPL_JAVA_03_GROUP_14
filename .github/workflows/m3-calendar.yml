name: M3 calendar acceptance
on:
  pull_request:
    paths: ['backend/**', 'mobile/**', '.github/workflows/m3-calendar.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [h2, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: m3_test
          POSTGRES_USER: m3_test
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U m3_test" --health-interval=5s
          --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test with H2
        if: matrix.database == 'h2'
        working-directory: backend
        run: mvn --batch-mode verify
      - name: Test PostgreSQL and production migrations
        if: matrix.database == 'postgres'
        working-directory: backend
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/m3_test
          TEST_DATABASE_USERNAME: m3_test
          TEST_DATABASE_PASSWORD: ci-test-only
          TEST_FLYWAY_LOCATIONS: classpath:db/migration
        run: mvn --batch-mode verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.database }}-results
          path: backend/target/surefire-reports/
  flutter:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze
      - working-directory: backend
        run: mvn --batch-mode package -DskipTests
      - name: Flutter suite including real API acceptance
        working-directory: backend
        shell: pwsh
        run: ./scripts/smoke-calendar-flutter.ps1 -AllTests
  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - working-directory: mobile
        run: flutter pub get
      - name: Compile native notification bridge (no signing)
        working-directory: mobile
        run: flutter build ios --debug --no-codesign
