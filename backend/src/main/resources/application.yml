spring:
  application:
    name: ourspace-backend
  profiles:
    active: dev
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

ourspace:
  pairing:
    invite-ttl-hours: 24
    invite-code-length: 6
