spring:
  datasource:
    url: jdbc:h2:mem:ourspace_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/h2-migration

ourspace:
  pairing:
    invite-ttl-hours: 24
    invite-code-length: 6
